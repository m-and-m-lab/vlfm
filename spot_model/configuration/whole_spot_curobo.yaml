# CuRobo robot configuration for the Spot arm + body URDF.

robot_cfg:
  kinematics:
    base_link: body
    ee_link: arm_link_fngr
  
    # Paths are absolute to avoid relying on curobo's internal asset root.
    usd_path: /workspace/isaaclab/scripts/interactive-search-zh/spot_model/spot_arm_w_cam.usd
    usd_robot_root: /spot
    urdf_path: /workspace/isaaclab/scripts/interactive-search-zh/spot_model/spot.urdf
    # Optional: set if the robot prim in USD is nested under a custom root.
    use_usd_kinematics: false
    use_global_cumul: true

    # Fix the hinge at the shoulder roll (present in URDF but not actuated in USD articulation).
    # lock_joints:
    #   arm_hr0: 0.0

    # Links to output kinematics for (in addition to ee_link). Extend if you want other frames.
    link_names:
      - arm_link_wr1
      - arm_link_fngr

    # Collision model derived from the existing Lula config for the arm.
    collision_link_names:
      - arm_link_sh0
      - arm_link_sh1
      - arm_link_el0
      - arm_link_el1
      - arm_link_wr0
      - arm_link_wr1
      - arm_link_fngr
    collision_spheres:
      arm_link_fngr:
        - center: [0.073, -0.023, -0.0]
          radius: 0.03578
        - center: [0.099, -0.016, -0.0]
          radius: 0.03381
        - center: [0.036, -0.031, -0.002]
          radius: 0.03283
        - center: [0.145, -0.023, 0.01]
          radius: 0.02205
      arm_link_wr1:
        - center: [0.104, -0.004, -0.028]
          radius: 0.0513
        - center: [0.103, -0.0, 0.007]
          radius: 0.05008
      arm_link_wr0:
        - center: [0.012, -0.005, 0.0]
          radius: 0.05727
        - center: [0.002, -0.033, -0.0]
          radius: 0.05346
        - center: [-0.007, 0.001, 0.0]
          radius: 0.056
        - center: [0.018, -0.022, 0.001]
          radius: 0.056
        - center: [0.024, 0.007, 0.001]
          radius: 0.05027
        - center: [-0.005, -0.02, -0.0]
          radius: 0.05473
        - center: [0.034, 0.0, -0.018]
