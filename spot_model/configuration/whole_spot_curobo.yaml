          radius: 0.05382
        - center: [-0.084, 0.002, -0.0]
          radius: 0.05382
        - center: [-0.229, 0.009, 0.005]
          radius: 0.04561
        - center: [-0.157, 0.005, 0.003]
          radius: 0.05192
        - center: [-0.209, 0.001, -0.014]
          radius: 0.03993
        - center: [-0.115, 0.003, 0.001]
          radius: 0.05382
        - center: [-0.242, 0.012, -0.011]
          radius: 0.04056
        - center: [-0.207, -0.006, 0.011]
          radius: 0.03741
      arm_link_el0:
        - center: [0.059, 0.0, 0.061]
          radius: 0.06594
        - center: [0.018, 0.011, 0.018]
          radius: 0.05494
        - center: [0.096, -0.003, 0.073]
