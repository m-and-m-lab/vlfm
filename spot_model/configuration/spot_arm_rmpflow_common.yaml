# joint order：arm_sh0, arm_sh1, arm_el0, arm_el1, arm_wr0, arm_wr1
# f1x gripper joint is not included in the RMP joint space (independently controlled)

joint_limit_buffers: [0.06, 0.04, 0.03, 0.056, 0.037, 0.058]

frames:
  base_frame: body       
  ee_frame: arm_link_fngr       
  tcp_frame: arm_link_fngr

rmp_params:
  # ---- C-space target/trajectory RMP (UR10e start point, numerically stable) ----
  cspace_target_rmp:
    metric_scalar: 50.0
    position_gain: 100.0
    damping_gain: 50.0
    robust_position_term_thresh: 0.5
    inertia: 1.0

  cspace_trajectory_rmp:
    p_gain: 100.0
    d_gain: 10.0
    ff_gain: 0.25
    weight: 50.0

  cspace_affine_rmp:
    final_handover_time_std_dev: 0.25
    weight: 2000.0


  joint_limit_rmp:
    metric_scalar: 1000.0
    metric_length_scale: 0.01
    metric_exploder_eps: 1e-3
    metric_velocity_gate_length_scale: 0.01
    accel_damper_gain: 200.0
    accel_potential_gain: 1.0
    accel_potential_exploder_length_scale: 0.1
    accel_potential_exploder_eps: 1e-2

  joint_velocity_cap_rmp:
    max_velocity: 1.0
    velocity_damping_region: 0.3
    damping_gain: 1000.0
    metric_weight: 100.0

  target_rmp:
    accel_p_gain: 30.0
    accel_d_gain: 85.0
    accel_norm_eps: 0.075
    metric_alpha_length_scale: 0.05
    min_metric_alpha: 0.01
    max_metric_scalar: 10000
    min_metric_scalar: 2500
    proximity_metric_boost_scalar: 20.0
    proximity_metric_boost_length_scale: 0.02
    xi_estimator_gate_std_dev: 20000.0
    accept_user_weights: false

  axis_target_rmp:
    accel_p_gain: 210.0
    accel_d_gain: 60.0
    metric_scalar: 10
    proximity_metric_boost_scalar: 3000.0
    proximity_metric_boost_length_scale: 0.08
    xi_estimator_gate_std_dev: 20000.0
    accept_user_weights: false


  collision_rmp:
    damping_gain: 50.0
    damping_std_dev: 0.04
    damping_robustness_eps: 1e-2
    damping_velocity_gate_length_scale: 0.01
    repulsion_gain: 800.0
    repulsion_std_dev: 0.01
    metric_modulation_radius: 0.5
    metric_scalar: 10000.0
    metric_exploder_std_dev: 0.02
    metric_exploder_eps: 0.001


  damping_rmp:
    accel_d_gain: 30.0
    metric_scalar: 50.0
    inertia: 100.0

canonical_resolve:
  max_acceleration_norm: 50.0
  projection_tolerance: 0.01
  verbose: false


body_cylinders: []
body_collision_controllers:
  - name: arm_link_wr1  
    radius: 0.05
  - name: arm_link_fngr
    radius: 0.05
